name: CI/CD Pipeline LMS

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install
      working-directory: ./course-service

    - name: Run tests
      run: echo "No tests yet"

    - name: Build Docker image
      run: docker build -t course-service:v1 ./course-service